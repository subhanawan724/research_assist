<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Research Agent</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>

</head>
<body>

<div class="container">
  <header>
    <h1>⚡ Research Agent</h1>
    <p class="tagline">Autonomous multi-tool research — search, read, cluster, find gaps.</p>
  </header>

  <div class="input-card">
    <textarea id="query" rows="3" placeholder="enter your search topic"></textarea>
    <button id="submitBtn">Start Research</button>
  </div>

  <div id="statusArea" class="status-area hidden">
    <div class="pulse-dot"></div>
    <span id="statusText">Working...(could take 5-6 min)</span>
  </div>

  <div id="questionBox" class="question-box hidden">
    <p id="questionText"></p>
    <input id="userResponse" placeholder="Your answer...">
    <button id="resumeBtn">Send</button>
  </div>

  <div id="resultCard" class="result-card hidden">
    <div class="result-header">
      <h2>Report</h2>
      <!--<a id="traceLink" href="#" target="_blank">View full trace →</a>-->
    </div>
    <div id="resultText"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
